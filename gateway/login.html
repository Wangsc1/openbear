<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>登录 · OpenBear</title>
<style nonce="{{.Nonce}}">
:root{color-scheme:light dark;--bg:#f7f7f6;--fg:#262626;--muted:#747474;--line:#d8d8d5;--field:#fff;--button:#303030;--button-text:#fff;--error:#a33d38}
@media(prefers-color-scheme:dark){:root{--bg:#191a1b;--fg:#ececeb;--muted:#a0a09d;--line:#414240;--field:#242526;--button:#e1e1dc;--button-text:#222;--error:#ef9991}}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}main{width:min(100% - 40px,340px);margin:clamp(48px,15vh,148px) auto 32px}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;letter-spacing:.04em}.mark{width:9px;height:9px;border:2px solid var(--fg);border-radius:3px}h1{font-size:23px;line-height:1.3;font-weight:600;margin:27px 0 8px}p{margin:0 0 23px;color:var(--muted)}label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}input{display:block;width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 11px;font:inherit;font-size:16px;line-height:1.35;color:var(--fg);background:var(--field)}input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--muted);outline-offset:3px}button,.button{display:block;width:100%;border:1px solid var(--button);border-radius:6px;background:var(--button);color:var(--button-text);padding:10px 12px;font:inherit;font-weight:500;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.actions{display:grid;gap:10px;margin-top:22px}.secondary{background:transparent;color:var(--fg);border-color:var(--line)}[hidden]{display:none!important}.status{font-size:13px;min-height:22px;margin:14px 0 0;color:var(--muted);overflow-wrap:anywhere}.status.error{color:var(--error)}.account{color:var(--fg);font-weight:500;overflow-wrap:anywhere}.foot{border-top:1px solid var(--line);padding-top:15px;margin-top:26px;font-size:12px;color:var(--muted)}
</style>
</head>
<body data-next="{{.Next}}">
<main>
<div class="brand"><span class="mark" aria-hidden="true"></span>OpenBear</div>
<h1>登录</h1>
<p>使用你的账号，进入自己的实例。</p>
<form id="login-form" action="/api/auth/password/login" method="post" hidden>
<label for="username">账号</label><input id="username" name="username" aria-label="账号" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="128" required>
<label for="password">密码</label><input id="password" name="password" aria-label="密码" type="password" autocomplete="current-password" maxlength="1024" required>
<div class="actions"><button id="submit" type="submit">登录</button></div>
</form>
<section id="current-session" aria-label="当前登录" hidden>
<p>当前已登录 <span id="current-account" class="account"></span></p>
<div class="actions"><a id="continue" class="button" href="{{.Next}}">继续当前登录</a><button id="logout" class="secondary" type="button">退出并切换账号</button></div>
</section>
<p id="status" class="status" role="status" aria-live="polite">正在确认登录状态…</p>
<p class="foot">页面与业务由你的节点提供。登录后仍在当前地址访问。</p>
<noscript><p>请启用 JavaScript 以安全提交登录表单。</p></noscript>
</main>
<script nonce="{{.Nonce}}">
(() => {
  'use strict';
  const form = document.getElementById('login-form');
  const panel = document.getElementById('current-session');
  const status = document.getElementById('status');
  const password = document.getElementById('password');
  const submit = document.getElementById('submit');
  const logout = document.getElementById('logout');
  const next = document.body.dataset.next;
  let context = null;
  let busy = false;
  function message(text, error = false) { status.textContent = text; status.classList.toggle('error', error); }
  function signedOut() { context = null; panel.hidden = true; form.hidden = false; password.value = ''; message(''); }
  async function call(path, options = {}) {
    const response = await fetch(path, {credentials:'same-origin', cache:'no-store', redirect:'error', ...options});
    let data = {}; try { data = await response.json(); } catch (_) {}
    return {response, data};
  }
  // Bootstrap once on this new login page. A later 409 must never silently
  // adopt another tab's context or log out the account that replaced ours.
  async function bootstrap() {
    try {
      const {response, data} = await call('/api/auth/session');
      if (response.status === 401) { signedOut(); return; }
      if (!response.ok || !data.contextToken) { message('暂时无法确认登录状态，请稍后刷新。', true); return; }
      context = data.contextToken;
      document.getElementById('current-account').textContent = data.username || '';
      form.hidden = true; panel.hidden = false;
      const expected = new URL(next, location.origin).searchParams.get('_ob_instance');
      const mismatch = expected && expected !== data.instanceId;
      document.getElementById('continue').hidden = Boolean(mismatch);
      message(mismatch ? '这条通知属于其他实例。请退出后使用对应账号登录。' : '继续使用当前账号，或先退出再切换。', Boolean(mismatch));
    } catch (_) { message('连接暂时不可用，请稍后刷新。', true); }
  }
  form.addEventListener('submit', async event => {
    event.preventDefault(); if (busy) return;
    busy = true; submit.disabled = true; message('正在登录…');
    try {
      const {response} = await call('/api/auth/password/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.getElementById('username').value.trim(), password:password.value})});
      if (response.ok) { password.value = ''; location.assign(next); return; }
      if (response.status === 409) { message('已有登录状态。请刷新此页，确认当前账号后先退出。', true); }
      else if (response.status === 429) { message('尝试较多或服务繁忙，请稍后重试。', true); }
      else if (response.status === 401) { message('账号或密码不正确。', true); }
      else { message('暂时无法登录，请稍后重试。', true); }
      password.value = '';
    } catch (_) { message('连接暂时不可用，请稍后重试。', true); }
    finally { busy = false; submit.disabled = false; }
  });
  logout.addEventListener('click', async () => {
    if (busy || !context) return;
    busy = true; logout.disabled = true; message('正在退出…');
    try {
      const {response} = await call('/api/auth/logout', {method:'POST', headers:{'X-OpenBear-Context':context}});
      if (response.ok) { signedOut(); document.getElementById('username').focus(); }
      else if (response.status === 401 || response.status === 409) { context = null; document.getElementById('continue').hidden = true; message('登录状态已变化，请重新打开登录页确认。', true); }
      else { message('退出未完成，请稍后重试。', true); }
    } catch (_) { message('连接暂时不可用，尚未退出。', true); }
    finally { busy = false; logout.disabled = false; }
  });
  bootstrap();
})();
</script>
</body>
</html>
