# 手机关键流程（ob-phone）：
# 打开最长对话 -> 快速滑到顶部再回到底部 -> 向上翻页 -> 展开工作块 -> 工具详情 Sheet -> 系统返回关闭 -> 回到会话列表
appId: dev.openbear.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "conv-a6a877ad"
    timeout: 30000
- tapOn:
    id: "conv-a6a877ad"
- extendedWaitUntil:
    visible:
      id: "row-answer"
    timeout: 30000
- takeScreenshot: phone-01-open-longest
# 快速向上甩动（手指向下），触发向上翻页
- repeat:
    times: 6
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 120
- waitForAnimationToEnd
- takeScreenshot: phone-02-fast-fling-up-paged
# 一键到顶，再一键回底
- tapOn:
    id: "jump-top"
- waitForAnimationToEnd
- takeScreenshot: phone-03-jump-top
- extendedWaitUntil:
    visible:
      id: "jump-bottom"
    timeout: 10000
- tapOn:
    id: "jump-bottom"
- waitForAnimationToEnd
- takeScreenshot: phone-04-back-to-bottom
# 快速向下甩回底部附近后，展开最后一轮的工作块
- scrollUntilVisible:
    element:
      id: "row-work-summary"
    direction: UP
    timeout: 20000
- tapOn:
    id: "row-work-summary"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: phone-05-work-expanded
- tapOn:
    id: "row-tool"
    index: 0
- extendedWaitUntil:
    visible:
      id: "detail-title"
    timeout: 15000
- takeScreenshot: phone-06-tool-detail-sheet
- back
- waitForAnimationToEnd
- assertVisible:
    id: "conversation-view"
- takeScreenshot: phone-07-sheet-closed-by-back
- back
- waitForAnimationToEnd
- assertVisible:
    id: "conversation-list"
