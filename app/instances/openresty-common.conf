# Install ONCE inside an independently running OpenResty http {} block.
# This is material only: no development process installs or reloads it.
# Reconcile existing default_server listeners before authorized installation.
map $http_upgrade $instance_connection_upgrade {
    default upgrade;
    '' close;
}

# Unknown hosts must never fall through to a family instance or the controller.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

